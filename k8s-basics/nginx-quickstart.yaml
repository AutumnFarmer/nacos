apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2               # 1.我们要 2 个 Nginx 员工
  selector:
    matchLabels:
      app: nginx-demo       # 2.这些员工必须戴着 "nginx-demo" 的工牌
  template:
    metadata:
      labels:
        app: nginx-demo     # 3.给新员工发 "nginx-demo" 工牌
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: LoadBalancer        # 4.申请一个外部可访问的 IP (VIP)
  selector:
    app: nginx-demo         # 5.转发流量给所有戴 "nginx-demo" 工牌的 Pod
  ports:
    - protocol: TCP
      port: 80              # Service 对外暴露的端口
      targetPort: 80        # 转接到 Pod 的端口
