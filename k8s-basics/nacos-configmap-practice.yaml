apiVersion: v1
kind: ConfigMap
metadata:
  name: nacos-consumer-config
data:
  application.yml: |
    server:
      port: 8080
    spring:
      application:
        name: nacos-consumer
      cloud:
        nacos:
          discovery:
            server-addr: nacos-headless-service:8848
